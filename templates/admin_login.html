<!doctype html>
<html lang="fr">
<head>

<title>Connexion — TradeScope</title>

</head>
<body>
<div class="brand-bg" aria-hidden="true"></div>
<div class="container" style="padding:80px 20px; max-width:420px;">
  {% with messages = get_flashed_messages(with_categories=true) %}

  <h1 style="color:#fff;">Connexion pro</h1>
  <form method="post" action="/admin">

  </form>
</div>
</body>
</html>
